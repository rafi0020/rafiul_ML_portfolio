<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Transfer Learning for Mental Stability Classification — conceptual workflow</title>
<desc id="desc">Conceptual workflow: Prepare spectrograms → Define training regimes → Compare three models → Report study results.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10182b"/><stop offset="1" stop-color="#080e1a"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69cfec"/></marker></defs>
<rect x="1" y="1" width="1278" height="718" rx="32" fill="url(#bg)" stroke="#33405b"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="66" fill="#9cdef1" font-size="22" letter-spacing="3">RESEARCH · CONCEPTUAL WORKFLOW</text>
<text x="64" y="118" fill="#f3f5ff" font-size="36" font-weight="700">Transfer Learning for Mental Stability Classification</text>
<path d="M 590 268 H 655" fill="none" stroke="#69cfec" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 944 378 V 405" fill="none" stroke="#69cfec" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 674 530 H 611" fill="none" stroke="#69cfec" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="64" y="164" width="530" height="206" rx="22" fill="#141e34" stroke="#354866"/><text x="92" y="206" font-size="24" font-weight="700" fill="#aa98ff">01</text>
<text x="92" y="246" font-size="29" font-weight="700" fill="#f3f5ff">Prepare spectrograms</text>
<text x="92" y="303" font-size="23" fill="#b9c8df">Represent voice recordings as image</text>
<text x="92" y="331" font-size="23" fill="#b9c8df">inputs.</text>
<rect x="684" y="164" width="530" height="206" rx="22" fill="#141e34" stroke="#354866"/><text x="712" y="206" font-size="24" font-weight="700" fill="#aa98ff">02</text>
<text x="712" y="246" font-size="29" font-weight="700" fill="#f3f5ff">Define training regimes</text>
<text x="712" y="303" font-size="23" fill="#b9c8df">Compare augmentation and transfer</text>
<text x="712" y="331" font-size="23" fill="#b9c8df">learning.</text>
<rect x="684" y="428" width="530" height="206" rx="22" fill="#141e34" stroke="#354866"/><text x="712" y="470" font-size="24" font-weight="700" fill="#aa98ff">03</text>
<text x="712" y="510" font-size="29" font-weight="700" fill="#f3f5ff">Compare three models</text>
<text x="712" y="567" font-size="23" fill="#b9c8df">Evaluate VGG16, InceptionV3, and</text>
<text x="712" y="595" font-size="23" fill="#b9c8df">DenseNet121.</text>
<rect x="64" y="428" width="530" height="206" rx="22" fill="#141e34" stroke="#354866"/><text x="92" y="470" font-size="24" font-weight="700" fill="#aa98ff">04</text>
<text x="92" y="510" font-size="29" font-weight="700" fill="#f3f5ff">Report study results</text>
<text x="92" y="567" font-size="23" fill="#b9c8df">Compare separate models; no ensemble</text>
<text x="92" y="595" font-size="23" fill="#b9c8df">fusion.</text>
<text x="64" y="679" fill="#b9c8df" font-size="21">High-level engineering stages · Scope and limitations in the case study</text></g></svg>