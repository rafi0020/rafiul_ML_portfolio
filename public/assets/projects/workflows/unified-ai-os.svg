<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Unified AI OS multi-assistant workflow</title>
  <desc id="desc">A user query is routed locally to concurrent browser-based assistant workers, collected, synthesized by a local model, streamed to the interface, and stored in local conversation history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1c"/><stop offset="1" stop-color="#071b20"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b8cff"/><stop offset="1" stop-color="#2bd5b2"/></linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#69a5ff" opacity=".14"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#667da0"/></marker>
  </defs>
  <rect width="1280" height="720" rx="30" fill="url(#bg)"/><rect width="1280" height="720" rx="30" fill="url(#dots)"/>
  <circle cx="1090" cy="72" r="220" fill="#27d2b3" opacity=".06"/><circle cx="110" cy="680" r="250" fill="#5b8cff" opacity=".07"/>
  <text x="72" y="78" fill="#74a0ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">INTERNAL R&amp;D • LOCAL-FIRST ORCHESTRATION</text>
  <text x="72" y="124" fill="#f1f6ff" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750">Unified AI OS</text>
  <text x="72" y="157" fill="#98a7bb" font-family="Inter,Arial,sans-serif" font-size="17">Route, compare, and synthesize assistant responses in one workspace</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="72" y="258" width="172" height="160" rx="22" fill="#101827" stroke="#31435f"/>
    <rect x="286" y="258" width="172" height="160" rx="22" fill="#101827" stroke="#355379"/>
    <rect x="500" y="210" width="240" height="256" rx="25" fill="#101827" stroke="#32665f"/>
    <rect x="782" y="258" width="172" height="160" rx="22" fill="#101827" stroke="#355379"/>
    <rect x="996" y="258" width="212" height="160" rx="22" fill="#101827" stroke="#32665f"/>
  </g>
  <g fill="none" stroke="#667da0" stroke-width="3" marker-end="url(#arrow)">
    <path d="M244 338h31"/><path d="M458 338h31"/><path d="M740 338h31"/><path d="M954 338h31"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(98 284)"><rect width="46" height="46" rx="13" fill="#5b8cff" opacity=".18"/><path d="M12 14h22v17H20l-7 6v-6h-1z" fill="none" stroke="#7fa7ff" stroke-width="2"/><text y="80" fill="#f1f6ff" font-size="18" font-weight="700">User query</text><text y="108" fill="#98a7bb" font-size="14">Mode + preference</text></g>
    <g transform="translate(312 284)"><rect width="46" height="46" rx="13" fill="#5b8cff" opacity=".18"/><circle cx="23" cy="23" r="11" fill="none" stroke="#7fa7ff" stroke-width="2"/><path d="M23 12v22M12 23h22" stroke="#7fa7ff" stroke-width="2"/><text y="80" fill="#f1f6ff" font-size="18" font-weight="700">Local router</text><text y="108" fill="#98a7bb" font-size="14">Selects workers</text></g>
    <text x="530" y="251" fill="#7ce0cb" font-size="15" font-weight="700" letter-spacing="2">CONCURRENT WORKERS</text>
    <g fill="#14222c" stroke="#315b58"><rect x="532" y="276" width="176" height="50" rx="14"/><rect x="532" y="341" width="176" height="50" rx="14"/><rect x="532" y="406" width="176" height="35" rx="12"/></g>
    <g fill="#edfdf9" font-size="15" font-weight="650"><text x="552" y="307">Assistant worker A</text><text x="552" y="372">Assistant worker B</text><text x="552" y="429">Additional workers</text></g>
    <g transform="translate(808 284)"><rect width="46" height="46" rx="13" fill="#5b8cff" opacity=".18"/><path d="M13 13h20v22H13zM17 19h12M17 25h12M17 31h8" stroke="#7fa7ff" stroke-width="2" fill="none"/><text y="80" fill="#f1f6ff" font-size="18" font-weight="700">Response set</text><text y="108" fill="#98a7bb" font-size="14">Labeled sources</text></g>
    <g transform="translate(1022 284)"><rect width="46" height="46" rx="13" fill="#2bd5b2" opacity=".16"/><path d="M15 14h16v16H15zM10 22h5M31 22h5M23 9v5M23 30v5" fill="none" stroke="#63e3ca" stroke-width="2"/><text y="80" fill="#f1f6ff" font-size="18" font-weight="700">Local synthesis</text><text y="108" fill="#98a7bb" font-size="14">Grounded final answer</text></g>
  </g>
  <g transform="translate(72 520)">
    <rect width="1136" height="114" rx="20" fill="#0d1723" stroke="#2f475e"/>
    <rect x="22" y="20" width="5" height="74" rx="3" fill="url(#accent)"/>
    <text x="52" y="49" fill="#f1f6ff" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Streaming workspace + local conversation store</text>
    <text x="52" y="80" fill="#98a7bb" font-family="Inter,Arial,sans-serif" font-size="15">Routing events • worker status • source inspection • synthesis tokens • message and source metadata</text>
  </g>
</svg>
