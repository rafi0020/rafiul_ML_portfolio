<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">VisionGuard on-prem video intelligence workflow</title>
  <desc id="desc">Secured camera streams pass through stream supervision, bounded local inference, spatial event rules, evidence handling, and an operator console with health monitoring.</desc>
  <defs>
