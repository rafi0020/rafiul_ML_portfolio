  <script>
    // Restore a deep link that GitHub Pages bounced through 404.html,
    // and rewrite legacy #/route URLs to their clean equivalents.
    (function () {
      try {
        var redirect = sessionStorage.getItem('spa:redirect');
        if (redirect) {
          sessionStorage.removeItem('spa:redirect');
          if (redirect !== location.href) history.replaceState(null, '', redirect);
        }
        if (location.hash.indexOf('#/') === 0) {
          history.replaceState(null, '', location.hash.slice(1) || '/');
        }
      } catch (e) { /* storage unavailable - fall through to the root route */ }
    })();
  </script>
